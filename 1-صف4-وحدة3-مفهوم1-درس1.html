<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار مستر رضا عوض التفاعلي</title>
    <style>
        /* التنسيقات والألوان (أزرق داكن + ذهبي) */
        :root {
            --dark-blue: #0a192f;
            --gold: #d4af37;
            --white: #e6f1ff;
            --accent: #172a45;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--dark-blue);
            color: var(--white);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 95%;
            max-width: 650px;
            background: var(--accent);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* شاشات اللعبة */
        .screen { display: none; animation: fadeIn 0.5s; }
        .active { display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* شاشة البداية */
        .intro-title { color: var(--gold); font-size: 2.2rem; margin-bottom: 20px; }
        .info-text { font-size: 1.2rem; margin: 10px 0; border-bottom: 1px solid var(--gold); padding-bottom: 10px; }
        .dhikr { font-style: italic; color: #8892b0; margin: 20px 0; }

        button.main-btn {
            background: var(--gold);
            color: var(--dark-blue);
            border: none;
            padding: 15px 45px;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button.main-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4); }

        /* الأسئلة */
        .header-info { font-size: 0.9rem; color: var(--gold); margin-bottom: 20px; }
        .question-box { margin-bottom: 30px; }
        .question-text { font-size: 1.3rem; line-height: 1.6; margin-bottom: 25px; }

        .options-list { display: grid; gap: 15px; }
        .opt-btn {
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--white);
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.3s;
            text-align: right;
        }

        .opt-btn:hover { background: rgba(212, 175, 55, 0.1); }
        .correct { background: #28a745 !important; border-color: #28a745; animation: shine 0.5s; }
        .wrong { background: #dc3545 !important; border-color: #dc3545; }

        @keyframes shine { 0% { opacity: 1; } 50% { opacity: 0.5; transform: scale(1.02); } 100% { opacity: 1; } }

        /* لوحة النتائج */
        table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid var(--gold); padding: 12px; text-align: center; }
        .footer-msg { margin-top: 30px; color: var(--gold); font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen" class="screen active">
            <div class="info-text">مستر رضا عوض</div>
            <div class="info-text">00201093559477</div>
            <h1 class="intro-title">مرحباً بكم في رحلة التميز</h1>
            <p class="dhikr">"لا إله إلا أنت سبحانك إني كنت من الظالمين"</p>
            <button class="main-btn" onclick="startGame()">ابدأ الاختبار</button>
        </div>

        <div id="quiz-screen" class="screen">
            <div class="header-info">مستر رضا عوض | 00201093559477</div>
            <div class="question-box">
                <div id="q-text" class="question-text"></div>
                <div id="options" class="options-list"></div>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <h2 style="color: var(--gold);">نتائج الاختبار الإحصائية</h2>
            <table>
                <thead>
                    <tr>
                        <th>رقم السؤال</th>
                        <th>عدد المحاولات</th>
                    </tr>
                </thead>
                <tbody id="stats-table"></tbody>
            </table>
            <div id="total-summary" style="font-size: 1.2rem; margin: 20px 0;"></div>
            <div class="footer-msg">
                مستر رضا عوض يتمنى لكم التوفيق والنجاح<br>
                00201093559477
            </div>
            <button class="main-btn" onclick="location.reload()" style="font-size: 1rem; padding: 10px 20px;">إعادة المحاولة</button>
        </div>
    </div>

    <script>
        // مصفوفة الأسئلة (صح/خطأ واختر فقط)
        const quizData = [
            { q: "يمكن تشغيل جميع الأجهزة التي نستخدمها دون الحاجة إلى طاقة.", options: ["صح", "خطأ"], answer: "خطأ" },
            { q: "يبعد كوكب المريخ عن الأرض مسافة تزيد عن 54 مليون كيلومتر تقريبًا.", options: ["صح", "خطأ"], answer: "صح" },
            { q: "الطاقة الشمسية مصدر طاقة نظيف.", options: ["صح", "خطأ"], answer: "صح" },
            { q: "يمكن التحكم في عربات استكشاف المريخ عن بُعد.", options: ["صح", "خطأ"], answer: "صح" },
            { 
                q: "تستهلك السيارة اللعبة الطاقة الكهربائية، وتحولها إلى الطاقات التالية، ما عدا الطاقة ........", 
                options: ["الحركية", "الصوتية", "الكيميائية", "الحرارية"], 
                answer: "الكيميائية" 
            },
            { 
                q: "أيّ من تحولات الطاقة التالية تصف فكرة عمل روبوتات استكشاف الفضاء المزودة بالألواح الشمسية؟", 
                options: ["كيميائية ← كهربائية ← حركية", "ضوئية ← كهربائية ← حركية", "وضع ← حركية ← كهربائية", "كهربية ← ضوئية ← حركية"], 
                answer: "ضوئية ← كهربائية ← حركية" 
            }
        ];

        let currentIdx = 0;
        let attempts = Array(quizData.length).fill(0);

        // نظام الصوت باستخدام Web Audio API (بدون ملفات خارجية)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playEffect(isCorrect) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if(isCorrect) {
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.2);
            } else {
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.2);
            }
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('quiz-screen').classList.add('active');
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('q-text').innerText = (currentIdx + 1) + ". " + q.q;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => check(opt, btn);
                optionsDiv.appendChild(btn);
            });
        }

        function check(selected, btn) {
            attempts[currentIdx]++;
            if(selected === quizData[currentIdx].answer) {
                btn.classList.add('correct');
                playEffect(true);
                setTimeout(() => {
                    currentIdx++;
                    if(currentIdx < quizData.length) loadQuestion();
                    else showResults();
                }, 700);
            } else {
                btn.classList.add('wrong');
                playEffect(false);
                setTimeout(() => btn.classList.remove('wrong'), 400);
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').classList.remove('active');
            document.getElementById('result-screen').classList.add('active');
            
            const table = document.getElementById('stats-table');
            let total = 0;
            quizData.forEach((_, i) => {
                const row = `<tr><td>${i+1}</td><td>${attempts[i]}</td></tr>`;
                table.innerHTML += row;
                total += attempts[i];
            });
            document.getElementById('total-summary').innerText = `إجمالي المحاولات لجميع الأسئلة: ${total}`;
        }
    </script>
</body>
</html>
